name : 🐦‍⬛ Pages

concurrency:
  cancel-in-progress : false
  group              : ${{ github.workflow }}

jobs:
  press:
    name    : 🪁 Press
    runs-on : &image ubuntu-26.04

    steps:
      - name : Provision the tools the site is pressed with
        uses : $/.github/actions/provision
        with : { tools: aqua:lycheeverse/lychee bun node }

      - name : Press the site and check every link in it
        run  : mise run site:links

      - name : Upload the pressed site
        uses : actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with : { if-no-files-found: error, name: site, path: docs/.vitepress/dist, retention-days: 1 }

    timeout-minutes : &timeout 15

  deploy:
    name    : 🪂 Deploy
    if      : ${{ github.ref == 'refs/heads/main' }}
    needs   : [press]
    outputs : { url: "${{ steps.deploy.outputs.deployment-url }}" }
    runs-on : *image

    steps:
      - name : Download the pressed site
        uses : actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with : { name: site, path: site }

      - name : Publish the site to the Cloudflare Pages project
        id   : deploy
        uses : cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0

        with:
          accountId       : ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken        : ${{ secrets.CLOUDFLARE_TOKEN }}
          command         : pages deploy site --project-name=thermur --branch=main
          wranglerVersion : 4.149.0

    timeout-minutes : *timeout

  gate:
    name    : 📡 Readout
    if      : ${{ always() }}
    needs   : [press, deploy]
    runs-on : *image

    steps:
      - name : Provision the tools the gate runs on
        uses : $/.github/actions/provision
        with : { tools: python uv }

      - name : Brief the workflow run and exit with its verdict
        env  : { NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:brief

    timeout-minutes : *timeout

on:
  push:
    branches : [main]
    paths    : [.github/actions/provision/**, .github/workflows/pages.yml, .mise/config.toml, .mise/mise.lock, .mise/tasks/site/**, docs/**, pyproject.toml, src/thermur/identity/fonts/**]

  workflow_dispatch:

permissions : { contents: read }
