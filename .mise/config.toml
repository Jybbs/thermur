min_version = "2026.11.12"

[doctor.checks.gh]
description = "`gh` is installed and signed in to GitHub"
hint        = "Run `gh auth login`, which signs `gh` in to GitHub for the `gh api` calls `mise scan` makes."
run         = "gh auth status"

[doctor.checks.packages]
description = "`.venv` holds what `uv.lock` resolves"
hint        = "Run `mise x -- uv sync`, which installs what `uv.lock` resolves into `.venv`."
run         = "uv sync --check"

[doctor.checks.venv]
description = "`.venv` was built on the interpreter `.mise/config.toml` pins"
hint        = "Run `mise x -- uv venv --clear` and then `mise x -- uv sync`, which rebuild `.venv` on the interpreter mise pins."
run         = '''test .venv/bin/python -ef "$(mise which python)"'''

[env]
AUDIT_IGNORE                   = "GHSA-fc5q-39xc-vjpf" # A ReDoS in picomatch, which only the development tooling installs and no release fixes
BUN_INSTALL_CACHE_DIR          = "{{config_root}}/.cache/bun"
HAMILTON_AUTOLOAD_EXTENSIONS   = "0"
JAX_COMPILATION_CACHE_DIR      = "{{config_root}}/.cache/jax"
JAX_COMPILATION_CACHE_MAX_SIZE = "67108864" # 64 MiB against the 8.7 MB in 32 entries that full runs wrote, since JAX locks the cache through filelock only under a limit
NPM_CONFIG_IGNORE_SCRIPTS      = "true"
PROSE_CACHE_DIR                = "{{config_root}}/.cache/prose"
PYTHONPYCACHEPREFIX            = "{{config_root}}/.cache/pycache"
UV_LOCKED                      = "1"
_.path                         = ".mise/bin"

[settings]
auto_install = false

[tool_config]
locked = true

[tools]
bun    = "1.4.4"
lychee = "0.24.2"
node   = "26.13.1"
python = "3.15.2"
uv     = "0.13.9"
zizmor = "1.32.0"
