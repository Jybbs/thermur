min_version = "2026.9.18"

[doctor.checks.packages]
description = "`.venv` holds what `uv.lock` resolves"
hint        = "Run `mise x -- uv sync`, which installs what `uv.lock` resolves into `.venv`."
run         = "uv sync --check"

[doctor.checks.venv]
description = "`.venv` was built on the interpreter `.mise/config.toml` pins"
hint        = "Run `mise x -- uv venv --clear` and then `mise x -- uv sync`, which rebuild `.venv` on the interpreter mise pins."
run         = '''test .venv/bin/python -ef "$(mise which python)"'''

[env]
HAMILTON_AUTOLOAD_EXTENSIONS = "0"
MPLCONFIGDIR                 = "{{config_root}}/.cache/matplotlib"
PROSE_CACHE_DIR              = "{{config_root}}/.cache/prose"
PYTHONPYCACHEPREFIX          = "{{config_root}}/.cache/pycache"
UV_LOCKED                    = "1"
_.path                       = ".mise/bin"

[settings]
auto_install = false

[tool_config]
locked = true

[tools]
"aqua:lycheeverse/lychee" = "0.24.2"
bun                       = "1.4.3"
node                      = "26.11.1"
python                    = "3.14.8"
uv                        = "0.12.22"
zizmor                    = "1.30.1"
