[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling==1.33.0"]

[project]
authors         = [{ name = "James Parkington" }]
dependencies    = [
    "apache-hamilton",
    "bibtexparser",
    "cyclopts",
    "diffrax",
    "equinox",
    "jax",
    "lineax",
    "markdown-it-py",
    "mdit-py-plugins",
    "netcdf4",
    "numpy",
    "packaging",
    "pydantic",
    "pydantic-settings",
    "pylatexenc",
    "pyyaml",
    "scipy",
    "semver",
    "xarray"
]
description     = "Flies a drone flock as a starling murmuration that breaks around a wildfire the way it breaks around a falcon."
keywords        = [
    "agent-based-modeling",
    "drones",
    "jax",
    "multi-agent-systems",
    "python",
    "simulation",
    "swarm-intelligence",
    "swarm-robotics",
    "wildfire"
]
license         = "MIT"
name            = "thermur"
readme          = ".github/README.md"
requires-python = ">=3.15"
version         = "0.2.0"

[project.scripts]
thermur = "thermur.cli:app"

[project.urls]
Homepage   = "https://thermur.fyi/"
Repository = "https://github.com/Jybbs/thermur"

[dependency-groups]
dev = [
    "apache-hamilton[experiments]",
    "filelock",
    "minijinja",
    "prose-formatter",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-socket",
    "pytest-testmon",
    "pytest-xdist",
    "syrupy"
]

[tool.coverage.html]
directory = ".cache/coverage/html"

[tool.coverage.report]
fail_under   = 95
precision    = 2
show_missing = true

[tool.coverage.run]
branch         = true
data_file      = ".cache/coverage/data"
relative_files = true
source         = ["src/thermur"]

[tool.hatch.build.targets.sdist]
only-include = [".mise", "src", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/thermur"]

[tool.hatch.build.targets.wheel.force-include]
".cache/hatch/thermur.start" = "thermur.start"

[tool.hatch.build.targets.wheel.hooks.version]
path     = ".cache/hatch/thermur.start"
template = "thermur.startup.imports:start"

[tool.prose]
target-version = "3.15"

[tool.prose.imports]
first-party = ["thermur"]

[tool.prose.rules.align-colons]
align-docstring-entries = false

[tool.pytest]
addopts                  = [
    "--allow-unix-socket",
    "--disable-socket",
    "--dist=worksteal",
    "--import-mode=importlib",
    "--numprocesses=auto",
    "-m",
    "not network",
    "-p",
    "common.isolation",
    "-p",
    "common.shares",
    "-ra",
    "--snapshot-dirname=fixtures"
]
cache_dir                = ".cache/pytest"
empty_parameter_set_mark = "fail_at_collect"
filterwarnings           = ["error"]
markers                  = [
    "network: reaches a service over the network",
    "reads: the patterns of the tracked files a case's checkout copies",
    "slow: runs longer than a few seconds"
]
norecursedirs            = ["common", "fixtures"]
python_files             = ["*.py"]
pythonpath               = ["tests"]
strict                   = true
testpaths                = ["tests"]

[tool.thermur.holds]
satori = "0.63 widens the gap around the middle dot in the preview cards' mono lines by about 7 px"

[tool.uv]
build-constraint-dependencies = [
    "cython==3.3.1",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "setuptools==84.2.1",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13"
]
exclude-newer                 = "P7D"
python-downloads              = "never"
python-preference             = "only-system"
required-version              = "==0.13.9"
