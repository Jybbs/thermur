[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling==1.32.4"]

[project]
authors         = [{ name = "James Parkington" }]
dependencies    = [
    "apache-hamilton",
    "bibtexparser",
    "equinox",
    "jax",
    "markdown-it-py",
    "mdit-py-plugins",
    "netcdf4",
    "numpy",
    "packaging",
    "pydantic",
    "pydantic-settings",
    "pylatexenc",
    "pyyaml",
    "xarray",
    "yaml-rs"
]
description     = "Flies a drone flock as a starling murmuration that breaks around a wildfire the way it breaks around a falcon."
keywords        = [
    "agent-based-modeling",
    "drones",
    "jax",
    "multi-agent-systems",
    "python",
    "simulation",
    "swarm-intelligence",
    "swarm-robotics",
    "wildfire"
]
license         = "MIT"
name            = "thermur"
readme          = "README.md"
requires-python = ">=3.15"
version         = "0.1.0"

[project.urls]
Homepage   = "https://thermur.fyi/"
Repository = "https://github.com/Jybbs/thermur"

[dependency-groups]
dev = [
    "minijinja",
    "prose-formatter",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-socket",
    "syrupy"
]

[tool.coverage.html]
directory = ".cache/coverage/html"

[tool.coverage.report]
precision    = 2
show_missing = true

[tool.coverage.run]
branch    = true
data_file = ".cache/coverage/data"
source    = ["src/thermur"]

[tool.hatch.build.targets.sdist]
only-include = [".mise", "src", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/thermur"]

[tool.hatch.build.targets.wheel.force-include]
".cache/hatch/thermur.start" = "thermur.start"

[tool.hatch.build.targets.wheel.hooks.version]
path     = ".cache/hatch/thermur.start"
template = "thermur.startup.imports:start"

[tool.prose]
target-version = "3.15"

[tool.prose.imports]
first-party = ["thermur"]

[tool.pytest]
addopts                  = [
    "--allow-unix-socket",
    "--disable-socket",
    "--import-mode=importlib",
    "-m",
    "not network",
    "-ra",
    "--snapshot-dirname=fixtures"
]
cache_dir                = ".cache/pytest"
empty_parameter_set_mark = "fail_at_collect"
filterwarnings           = ["error"]
markers                  = [
    "network: reaches a service over the network",
    "slow: runs longer than a few seconds"
]
norecursedirs            = ["common", "fixtures"]
python_files             = ["*.py"]
pythonpath               = ["tests"]
strict                   = true
testpaths                = ["tests"]

[tool.uv]
build-constraint-dependencies = [
    "cython==3.3.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "setuptools==84.2.1",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13"
]
python-downloads              = "never"
python-preference             = "only-system"
required-version              = "==0.12.22"
