[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling==1.32.4"]

[project]
authors         = [{ name = "James Parkington" }]
dependencies    = []
description     = "Thermally-constrained flocking for wildfires."
license         = "MIT"
name            = "thermur"
readme          = "README.md"
requires-python = ">=3.14"
version         = "0.1.0"

[project.urls]
Homepage   = "https://jybbs.github.io/thermur/"
Repository = "https://github.com/Jybbs/thermur"

[tool.hatch.build.targets.sdist]
only-include = [".mise", "src", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/thermur"]

[tool.uv]
build-constraint-dependencies = [
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13"
]
python-downloads              = "never"
python-preference             = "only-system"
required-version              = "==0.12.22"
